{% extends "myapp/base.html" %}

{% block header_title %}ユーザーアイコン変更{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data" action="{% url 'user_img_change' %}" >
    {% csrf_token %}
    <table>
        <tr>
            <td>{{ form.user_icon.label_tag }}</td>
            <td>{{ form.user_icon }}</td>
        </tr>
    </table>
    <button type="submit">変更</button>
    {% if form.errors %}
    <div>
        {% for field in form %}
        {{ field.errors }}
        <br>
        {% endfor %}
    </div>
    {% endif %}
</form>
{% endblock %}
