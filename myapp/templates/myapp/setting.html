{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{% static 'myapp/css/setting.css' %}" />
    {% block extra_style %}{% endblock %}
    <title>setting</title>
</head>
<body>
    {% block header %}
    <header class="header">
        <div class="header-container">
            <span class="header-container__title">
                {% block header-title %}設定{% endblock %}
            </span>
        </div>
    </header>
    {% endblock %}

    {% block content %}
    <div class="setting-wrap">
    <form class="setting-item" action="{% url 'myapp:setting_name' %}" method="get">
        <button type="submit" class="setting-btn">ユーザ名変更</button>
    </form>

    <form class="setting-item" action="{% url 'myapp:setting_email' %}" method="get">
        <button type="submit" class="setting-btn">メールアドレス<br>変更</button>
    </form>

    <form class="setting-item" action="{% url 'myapp:setting_icon' %}" method="get">
        <button type="submit" class="setting-btn">アイコン変更</button>
    </form>

    <form class="setting-item" action="{% url 'myapp:setting_password' %}" method="get">
        <button type="submit" class="setting-btn">パスワード変更</button>
    </form>
    <form class="logout-form" action="{% url 'myapp:logout' %}" method="post" >
        {% csrf_token %}
        <button type="submit" class="setting-btn">ログアウト</button>
    </form>
    </div>
  {% endblock %}

    {% block footer %}
     <footer class="footer">
        <div class="footer-container">
            <div class="footer-container__item">
                <a href="{% url 'myapp:friends' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="{% static 'myapp/img/people-24px.svg' %}"></span>
                    <span class="footer-item__text">友達</span>
                </a>
            </div>
            <div class="footer-container__item">
                <a href="{% url 'myapp:setting' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="{% static 'myapp/img/settings-black-18dp.svg' %}"></span>
                    <span class="footer-item__text">設定</span>
                </a>
            </div>
        </div>
    </footer>
    {% endblock %}
</body>
</html>
