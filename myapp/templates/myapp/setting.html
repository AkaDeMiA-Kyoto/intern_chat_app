{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'myapp/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'myapp/css/setting.css' %}">
    <title>設定</title>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <span class="header-container__title">
                {% block header-title %}設定{% endblock %}
            </span>
        </div>
    </header>

    <div class="container">
        <a href="{% url 'username' %}" class="button">ユーザー名変更</a>
        <br>
        <a href="{% url 'email' %}" class="button">メールアドレス変更</a>
        <br>
        <a href="{% url 'icon' %}" class="button">アイコン変更</a>
        <br>
        <a href="{% url 'password' %}" class="button">パスワード変更</a>
        <br>
        <form action="{% url 'logout' %}" method="POST">
            {% csrf_token %}
            <button type="submit" class="button">ログアウト</button>
        </form>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-container__item">
                <a href="{% url 'friends' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="{% static 'myapp/img/people-24px.svg' %}"></span>
                    <span class="footer-item__text">友達</span>
                </a>
            </div>
            <div class="footer-container__item">
                <a href="{% url 'setting' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="{% static 'myapp/img/settings-black-18dp.svg' %}"></span>
                    <span class="footer-item__text">設定</span>
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
