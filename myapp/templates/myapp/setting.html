{% extends 'myapp/base.html' %}
{% load static %}

{% block extra_style %}
<link rel="stylesheet" href="{% static 'myapp/css/settings.css' %}" />
{% endblock %}

{% block header %}
{% endblock %}

{% block content %}
<div class="btn-container">
    <a href="{% url 'username_change' %}" class="btn">ユーザー名変更</a>
    <a href="{% url 'email_change' %}" class="btn">メールアドレス変更</a>
    <a href="{% url 'image_change' %}" class="btn">アイコン変更</a>
    <a href="{% url 'password_change' %}" class="btn">パスワード変更</a>
    <form action="{% url 'logout' %}" method="POST"> <!-- a hrefはGetリクエストだが、LogoutViewはデフォでPOSTリクエストのみ受け付ける。 -->
        {% csrf_token %}
        <button type="submit" class="btn">ログアウト</button>
    </form>
</div>
{% endblock %}

{% block footer %}
{% endblock %}
