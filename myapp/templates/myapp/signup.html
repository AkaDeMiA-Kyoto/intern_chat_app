<!DOCTYPE html>
<html lang="ja">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeMiAインターン</title>
    <link rel="stylesheet" href="{% static 'myapp/css/signup.css' %}" />
    <link rel="stylesheet" href="{% static 'myapp/css/base.css' %}" />
  </head>
  <body>
    <div class="container">
      <h1 class="page-title">会員登録</h1>
      <form action="{% url 'signup_view' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-item">
          <label for="username">ユーザー名</label>
          <input type="text" name="username" id="username" value="{{ form.username.value|default:'' }}" required />
        </div>

        <div class="form-item">
          <label for="email">メールアドレス</label>
          <input type="email" name="email" id="email" value="{{ form.email.value|default:'' }}" required />
        </div>

        <div class="form-item">
          <label for="image">画像</label>
          <input type="file" name="image" id="image" />
        </div>

        <div class="form-item">
          <label for="password1">パスワード</label>
          <input type="password" name="password1" id="password1" required />
        </div>

        <div class="form-item">
          <label for="password2">パスワード(確認用)</label>
          <input type="password" name="password2" id="password2" required />
        </div>

        <button type="submit" class="submit-btn button">Sign Up</button>

        <a href="{% url "login" %}" class="login-link">ユーザー登録済の方はこちら</a>

        {% if form.non_field_errors %}
          <div class="non-field-errors">
            <ul>
              {% for error in form.non_field_errors %}
                <li>{{ error }}</li>
              {% endfor %}
            </ul>
          </div>
        {% endif %}
      </form>
    </div>
  </body>
</html>
