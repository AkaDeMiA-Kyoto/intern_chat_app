{% load static%}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'myapp/css/signup.css' %}">
    <title>Signup</title>
</head>
<body>
    <h1>会員登録</h1>
    <form action="{% url 'signup_view' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_ul }}
        <p><input type="submit" value="登録"></p>
    </form>
</body>
</html>
