{% extends 'myapp/base.html' %}
{% load static %}
{% block extra_style %}
<link rel="stylesheet" href="{% static 'myapp/css/signup.css' %}">
{% endblock %}
<body>
    {% block header %}
    <header class="header">
        会員登録
    </header>
    {% endblock %}
    {% block content %}
    <form method="post" enctype="multipart/form-data">
        {%csrf_token %}

        <div class="signup-form">
            <table>
                {{form.as_table}}
            </table>
        </div>
        <div class="submit-btn">
            <button  type="submit">submit</button>
        </div>  
    </form>
    {% endblock %}
</body>
