{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'myapp/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'myapp/css/icon.css' %}">
    <title>アイコン変更</title>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <span class="header-container__title">
                {% block header-title %}アイコン変更{% endblock %}
            </span>
        </div>
    </header>

    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <p>現在のアイコン:</p>
            <img src="{{ request.user.image.url }}" alt="現在のアイコン" class="current-icon">
            <br>
            <input type="file" name="new_icon" required>
            <br>
            <br>
            <button type="submit">アイコンをアップロード</button>
        </form>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-container__item">
                <a href="{% url 'friends' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="{% static 'myapp/img/people-24px.svg' %}"></span>
                    <span class="footer-item__text">友達</span>
                </a>
            </div>
            <div class="footer-container__item">
                <a href="{% url 'setting' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="{% static 'myapp/img/settings-black-18dp.svg' %}"></span>
                    <span class="footer-item__text">設定</span>
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
