{% extends "myapp/base.html" %}

{% block header_title %}パスワード変更{% endblock %}

{% block content %}
<form method="post" action="{% url 'password_change' %}">
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit">変更</button>
    {# エラーメッセージを表示 #}
    {% if form.errors %}
        <div>{{ form.errors }}</div>
    {% endif %}
</form>
{% endblock %}
