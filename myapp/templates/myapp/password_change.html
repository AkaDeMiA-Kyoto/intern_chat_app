{% extends 'myapp/base.html' %}
{% load static %}
{% block title %} password {% endblock %}
{% block extra_style %}
<link rel="stylesheet" type="text/css" href="{% static 'myapp/css/password_change.css' %}">
{% endblock %} 
{% block header-title %}パスワード変更{% endblock %}
{% block content %} 
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">送信</button>
</form>
{% endblock %}
{% block footer %}
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-container__item">
                <a href="{% url 'myapp:friends' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="/static/myapp/img/people-24px.svg"></span>
                    <span class="footer-item__text">友達</span>
                </a>
            </div>
            <div class="footer-container__item">
                <a href="{% url 'myapp:setting' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="/static/myapp/img/settings-black-18dp.svg"></span>
                    <span class="footer-item__text">設定</span>
                </a>
            </div>
        </div>
    </footer>
{% endblock %}
