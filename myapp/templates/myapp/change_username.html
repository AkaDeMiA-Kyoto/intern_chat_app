{% extends 'myapp/base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% block header-title %}ユーザー名{% endblock %}
    {% block content %}
    <form method="POST">
        {% csrf_token %}
        <div>新しいユーザー名：{{ form.username }}</div>
        {% if form.error %}
        {{ form.username.error }}
        {% endif %}
        <button type="submit">送信</button>
    </form>
    {% endblock %}
</body>
</html>
