{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <link rel="stylesheet" href="{% static 'myapp/css/friends.css' %}">
    <title>Friends</title>
</head>
<body>
    <header>友達</header>
    <div class="friend_list">
        {% for id,username,icon,arrived_at,message in zipped_data %}
        <a href="{% url 'talk_room' id %}">
        <div class="person">
            <img src="{{ icon.url }}" class="icon">
            <div class="inf">
                <div class="name">{{ username }}</div>
                <div class="flex">
                    <div class="message">{{ message.message }}</div>
                    <div class="time">{{ arrived_at.arrived_at }}</div>
                </div>
            </div>
        </div>
        </a>
        {% endfor %}
        {% for id,username,icon,arrived_at in zipped_never_data %}
        <a href="{% url 'talk_room' id %}">
        <div class="person">
            <img src="{{ icon.url }}" class="icon">
            <div class="inf">
                <div class="name">{{ username }}</div>
                <div class="flex"> 
                    <div class="space"></div>
                    <div class="time">{{ arrived_at }}</div>
                </div>
            </div>
        </div>
        </a>
        {% endfor %}
    </div>
    <footer>
        <div class="foot">
            <a href="{% url 'friends' %}">
                <img href="/home/issei827/django_project2/intern_chat_app/myapp/static/myapp/img/people-24px.svg" class="image">
                <div class="letters">友達</div>
            </a>
        </div>
        <div class="foot">
            <a href="{% url 'setting' %}">
                <img href="/home/issei827/django_project2/intern_chat_app/myapp/static/myapp/img/settings-black-18dp.svg" class="image">
                <div class="letters">設定</div>
            </a>
        </div>
    </footer>

    
</body>
</html>
