{% extends 'myapp/base.html' %}
{% load static %}

{% block extra_style %}
<link rel="stylesheet" type="text/css" href="{% static 'myapp/css/friends.css' %}" >
{% endblock %}

{% block header-title %}友達{% endblock %}

{% block content %}
<div class="friends-wrapper">
    {% for user, message, time in info %}
        <a href="{% url 'myapp:talk_room' user.id %}" class="friend-link">
            <div class="friend">
                    {% if user.img %}
                        <img src="{{user.img.url}}" alt="icon" width="70px" height="70px" class="icon">
                    {% endif %}
                    <div class="friend-content">
                        <p class="username">{{user.username}}</p>
                        <p class="latest_message">{{message}}</p>
                    </div>
                    <p class="sended_at">{{time}}</p>
            </div>
        </a>
    {% endfor %}
</div>
{% endblock %}
