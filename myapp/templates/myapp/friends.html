{% extends 'myapp/base.html' %}
{% load static %}

{% block extra_style %}
<link rel="stylesheet" type="text/css" href="{% static 'myapp/css/friends.css' %}" >
{% endblock %}

{% block header-title %}友達{% endblock %}

{% block content %}
<div class="friends-wrapper">
    {% for user in users %}
        <a href="{% url 'myapp:talk_room' user.id %}" class="friend-link">
            <div class="friend">
                    {% if user.img %}
                        <img src="{{user.img.url}}" alt="icon" width="50px" height="50px">
                    {% endif %}
                    <p class="username">{{user.username}}</p>
            </div>
        </a>
    {% endfor %}
</div>
{% endblock %}
