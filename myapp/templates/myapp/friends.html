{% extends 'myapp/base.html' %}
{% load static %}
{% block extra_style %}
<link rel="stylesheet" href="{% static 'myapp/css/friends.css' %}">
{% endblock %}
{% block header %}
<header class="header">
  友達
</header>
{% endblock %}
{% block content %}
<body> 
  <form action="" method="get">
    <input name="query" value="{{ request.GET.query }}" type="text" />
    <button type="submit">検索する</button>
  </form>
  {% for friend in friends %}
  <div class="talk">
    <button class="friend-info">
      <a href="{% url 'talk_room' friend.id %}">
        {% if friend.image %}
        <div class = friend_icon><img src="{{ friend.image.url}}"></div>
        {% endif %}
        <div class = friend>{{ friend }}</div>
        {% if friend.latest_talk %}
        <div class = talk-info>
          <div class = talk_latest>{{ friend.latest_talk }}</div>
          <div class = talk_time>{{ friend.latest_talk.talk_time }}</div>  
        </div>
        {% endif %}
      </a>
    </button>  
  </div>
  {% endfor %}
</body>
{% endblock %}
</html>
