<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フレンド</title>
</head>
<body>
    {% for user_data in users %}
    <a href="{% url 'talk_room' user_data.user.id %}" style="text-decoration: none; color: inherit;">
        <div class="user-box">
            <div class="user-info">
                <img src="{{ user_data.user.image.url }}" alt="ユーザーアイコン" class="user-icon">
                <span class="username">{{ user_data.user.username }}</span>
            </div>
            <div class="talk-info">
                <p class="latest-talk">{{ user_data.latest_talk }}</p>
                <span class="talk-time">{{ user_data.latest_talk_time|date:"Y-m-d H:i" }}</span>
            </div>
        </div>
    </a>
    {% endfor %}
</body>
</html>
