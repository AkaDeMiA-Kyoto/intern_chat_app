{% extends "myapp/base.html" %}
{% load static %}

{% block extra_style %}
<link rel="stylesheet" href="{% static 'myapp/css/onetimecode.css' %}">
{% endblock %}

{% block header_title %}ワンタイムパスワード{% endblock %}

{% block content %}
<form method="post">
  {% csrf_token %}
  <label for="code">ワンタイムパスワード</label>
  <input type="text" name="code" id="name"><br>
  <button type="submit">送信</button>
</form>
{% if error_message %}
  <p>{{ error_message }}</p>
{% endif %}
{% endblock %}

{% block footer %}{% endblock %}
