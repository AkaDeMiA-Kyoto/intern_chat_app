<form method="post">
  {% csrf_token %}
  <label for="name"> ユーザー名</label> 
  <input type="text" name="username" id="name"><br>
  <label for="pass"> パスワード</label>
  <input type="password" name="password" id="pass"><br>
  <button type="submit">ログイン</button>
</form>
{% if error_message %}
  <p>{{ error_message }}</p>
{% endif %}
