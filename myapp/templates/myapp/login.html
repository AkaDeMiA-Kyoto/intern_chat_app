{% extends 'myapp/base.html' %}
{% load static %}
{% block extra_style %}
<link rel="stylesheet" href="{% static 'myapp/css/login.css' %}">
{% endblock %}
{% block header %}
<header class="header">
    ログイン
</header>
{% endblock %}
{% block content %}
<body>

        {% if request.session.otp_phase %}  
        <form action="{% url 'friends' %}" method="post">
            {% csrf_token %}
            <input
            type="texts"
            required
            size="10" />   
            <button  type="submit">ログイン</button>      
        </form>
        {% else %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <table>
                <div class="login-form">
                    {{form.as_table}}
                </div>
            </table>
            <button  type="submit">ログイン</button> 
        {% endif %}
    </form>
</body>
{% endblock %}
</html>
