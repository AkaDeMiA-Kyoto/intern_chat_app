{% extends 'myapp/base.html' %}
{% load static %}
{% block extra_style %}
<link rel="stylesheet" href="{% static 'myapp/css/login.css' %}">
{% endblock %}
{% block header %}
<header class="header">
    ログイン
</header>
{% endblock %}
{% block content %}
<body>
    <form action="{% url 'send_mail' %}" method="post">
        {% csrf_token %}
        <button type="submit">Mail</button>
    </form>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <table>
            <div class="login-form">
                {{form.as_table}}
            </div>
        </table>
        <button  type="submit">ログイン</button>    
    </form>
</body>
{% endblock %}
</html>
