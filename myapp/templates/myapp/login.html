<!DOCTYPE html>
<html lang="ja">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeMiAインターン</title>
    <link rel="stylesheet" href="{% static 'myapp/css/login.css' %}" />
    <link rel="stylesheet" href="{% static 'myapp/css/base.css' %}" />
  </head>
  <body>
    <div class="container">
      <h1 class="page-title">ログイン</h1>
      <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}

        <div class="form-item">
          <label for="username">ユーザー名</label>
          <input type="text" name="username" id="username" value="{{ form.username.value|default:'' }}" required />
        </div>

        <div class="form-item">
          <label for="password">パスワード</label>
          <input type="password" name="password" id="password" required />
        </div>

        <button type="submit" class="submit-btn button">ログイン</button>

        {% if form.non_field_errors %}
          <div class="non-field-errors">
            <ul>
              {% for error in form.non_field_errors %}
                <li>{{ error }}</li>
              {% endfor %}
            </ul>
          </div>
        {% endif %}
      </form>
    </div>
  </body>
</html>
