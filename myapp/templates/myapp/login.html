{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="{% static 'myapp/css/login.css'%}">
</head>

<body>
    <div class="hed">ログイン</div>
    {% if form.errors %}
    <div>ユーザーID,パスワードが一致しません.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div>ユーザーネーム：{{ form.username }}</div>
        <div>パスワード：{{ form.password }}</div>
        <button type="submit">ログイン</button>
    </form>
</body>

</html>
