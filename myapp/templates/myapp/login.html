<!DOCTYPE html>
<html lang="ja">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'myapp/css/login.css' %}" />
    <link rel="stylesheet" href="{% static 'myapp/css/base.css' %}" />
  </head>
  <body>
    <div class="container">
      <h1 class="page-title">ログイン</h1>
      <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}

        <div class="form-item">
          <label for="username">ユーザー名</label>
          <input type="text" name="username" id="username" value="{{ form.username.value|default:'' }}" required />
          {% if form.username.errors %}
            <div class="field-errors">{{ form.username.errors }}</div>
          {% endif %}
        </div>

        <div class="form-item">
          <label for="password">パスワード</label>
          <input type="password" name="password" id="password" required />
          {% if form.password.errors %}
            <div class="field-errors">{{ form.password.errors }}</div>
          {% endif %}
        </div>

        <button type="submit" class="submit-btn button">ログイン</button>
      </form>
    </div>
  </body>
</html>
