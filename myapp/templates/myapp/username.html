{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'myapp/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'myapp/css/username.css' %}">
    <title>ユーザー名変更</title>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <span class="header-container__title">
                {% block header-title %}ユーザー名変更{% endblock %}
            </span>
        </div>
    </header>

    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <p>現在のユーザー名: <strong>{{ request.user.username }}</strong></p>
            <input type="text" name="new_username" placeholder="新しいユーザー名" required>
            <button type="submit">変更</button>
        </form>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-container__item">
                <a href="{% url 'friends' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="{% static 'myapp/img/people-24px.svg' %}"></span>
                    <span class="footer-item__text">友達</span>
                </a>
            </div>
            <div class="footer-container__item">
                <a href="{% url 'setting' %}" class="footer-item__link">
                    <span class="footer-item__icon"><img src="{% static 'myapp/img/settings-black-18dp.svg' %}"></span>
                    <span class="footer-item__text">設定</span>
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
