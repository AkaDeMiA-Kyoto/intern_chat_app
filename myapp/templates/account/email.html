{% extends 'myapp/base.html' %}

{% block header-title %}メールアドレスの変更{% endblock %}

{% block content %}
  <form method="post" action="{% url 'account_email' %}">
    {% csrf_token %}
    <p>現在のメールアドレス: {{user.email}}</p>

    <p>新しいメールアドレスを入力してください</p>
    {{ form.as_p }}

    <button type="submit">変更</button>
  </form>
{% endblock %}

{% block extra_style %}
  {% load static %}
  <link rel="stylesheet" href="{% static 'myapp/css/email.css' %}" />
{% endblock %}
