{% extends 'myapp/base.html' %}

{% block header-title %}パスワードの変更{% endblock %}

{% block content %}
  <p>指定されたメールアドレスにパスワードリセットの手順を送信しました。</p>
  <p>メールを確認し、記載されたリンクに従ってパスワードをリセットしてください。</p>
  <a href="{% url 'account_login' %}">ログインページに戻る</a>
{% endblock %}

{% block extra_style %}
  {% load static %}
  <link rel="stylesheet" href="{% static 'myapp/css/password_reset_done.css' %}" />
{% endblock %}
