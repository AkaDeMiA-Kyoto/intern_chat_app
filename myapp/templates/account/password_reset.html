{% extends 'myapp/base.html' %}

{% block header-title %}パスワードの変更{% endblock %}

{% block content %}
  <p>パスワード変更のurlを送るメールアドレスを入力してください</p>
  <form method="post">
    {% csrf_token %}
    <div>
      <label for="email">メールアドレス</label>
      {{ form.email }}
    </div>
    <button type="submit">送信</button>
  </form>
{% endblock %}

{% block extra_style %}
  {% load static %}
  <link rel="stylesheet" href="{% static 'myapp/css/password_reset.css' %}" />
{% endblock %}
